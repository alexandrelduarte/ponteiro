<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Fallback vetorial da textura "papel de boletim": grão fino via feTurbulence,
       quase imperceptível, tom do token papel (#E8E8DF). Sem objetos, sem símbolos (R4). -->
  <defs>
    <filter id="grao" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="26" stitchTiles="stitch" result="ruido"/>
      <feColorMatrix in="ruido" type="matrix" values="0 0 0 0 0.36  0 0 0 0 0.36  0 0 0 0 0.33  0 0 0 0.05 0"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#E8E8DF"/>
  <rect width="1200" height="630" filter="url(#grao)"/>
</svg>
